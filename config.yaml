# =============================================================================
# Solar Forecasting Project — Global Configuration
# =============================================================================
# All paths are relative to the project root unless otherwise noted.

# -----------------------------------------------------------------------------
# File Paths
# -----------------------------------------------------------------------------
data_paths:
  preprocessed_dir: "data/preprocessed/"
  energy_cost_csv: "energy_cost.csv"           # relative to preprocessed_dir
  energy_consumed_csv: "energy_consumed.csv"   # relative to preprocessed_dir
  energy_generated_csv: "energy_generated.csv" # relative to preprocessed_dir
  lstm_target_column_name: "Generated Energy (W)"
  models_dir: "models/artifacts/"              # trained model binaries (.pth, .pkl)
  figures_dir: "reports/figures/"              # generated plot PNGs
  lstm_model_name: "lstm_solar_generator.pth"
  sarima_cost_model_name: "sarima_cost_model.pkl"
  sarima_consumed_model_name: "sarima_consumed_model.pkl"
  lstm_scaler_name: "lstm_scaler.pkl"

# -----------------------------------------------------------------------------
# Raw Data Sources (used by scripts/build_*.py only)
# Place the downloaded raw CSVs in data/ before running these scripts.
# -----------------------------------------------------------------------------
raw_data:
  consumption_csv: "data/Electric_Consumption_And_Cost__2010_-_Feb_2025__20250311.csv"
  generation_csv: "data/generated_2009_2023.csv"

# -----------------------------------------------------------------------------
# Data Preprocessing
# -----------------------------------------------------------------------------
preprocessing:
  test_size: 0.2                  # fraction of full series held out for testing
  validation_size_from_train: 0.15  # fraction of training set used for validation
  lstm_time_steps: 168            # input window length in hours (168 h = 1 week)

# -----------------------------------------------------------------------------
# Model Parameters
# -----------------------------------------------------------------------------
lstm_params:
  input_size: 5
  hidden_size: 32
  num_layers: 1
  dropout: 0.3030108548374505
  output_chunk_size: 12
  bidirectional: true

sarima_params:
  cost:
    order: [1, 1, 1]          # (p, d, q)
    seasonal_order: [1, 1, 0, 52]  # (P, D, Q, s) — s=52 for weekly data
  consumed:
    order: [1, 1, 1]
    seasonal_order: [1, 1, 0, 52]

# -----------------------------------------------------------------------------
# Training Parameters
# -----------------------------------------------------------------------------
training_params:
  run_optuna_search: false      # set true to run Optuna hyperparameter search
  optuna_n_trials: 50
  lstm_epochs: 50
  lstm_batch_size: 128
  lstm_learning_rate: 0.0016297571709647026
  lstm_weight_decay: 0.0000217832965569439
  early_stopping_patience: 15

# -----------------------------------------------------------------------------
# Solar Generation Estimation (used by scripts/build_generation_data.py)
# Configured for New York City; adjust for other locations.
# -----------------------------------------------------------------------------
generation_estimation:
  # Geographic and panel configuration
  latitude: 40.71
  longitude: -74.00
  surface_tilt: 35.0       # degrees from horizontal
  albedo: 0.18             # ground reflectance
  noct_module_temp: 45.0   # Nominal Operating Cell Temperature (°C)
  system_pdc0_watts: 7500000.0  # DC system peak power (750 W/panel × 10,000 panels)
  temp_coeff_pdc: -0.0037  # power temperature coefficient (%/°C)
  # Column names in the raw generation CSV
  ambient_temp_col: "Temperature"
  ghi_col: "GHI"
  dni_col: "DNI"
  dhi_col: "DHI"
  solar_zenith_col: "Solar Zenith Angle"
  # Output column name written to the preprocessed CSV
  output_target_column_name: "Generated Energy (W)"

# -----------------------------------------------------------------------------
# Reference Solar System
# The LSTM was trained on data generated from this reference system.
# User-defined systems in the app are scaled relative to it.
# NOTE: 10,000 × 750 W = 7.5 MWp — this is utility-scale, not residential.
# -----------------------------------------------------------------------------
lstm_reference_system:
  num_panels: 10000
  panel_capacity_w: 750   # watts per panel

# -----------------------------------------------------------------------------
# Forecast Horizons
# -----------------------------------------------------------------------------
forecast_horizons:
  default_app_horizon: "1 Month"
  training_eval_horizon_weekly: 4   # weeks; for SARIMA evaluation
  training_eval_horizon_hourly: 96  # hours; for LSTM evaluation
  steps_map:
    "1 Month":
      hourly: 720    # 24 × 30
      weekly: 4
    "6 Months":
      hourly: 4320   # 24 × 180
      weekly: 24
    "1 Year":
      hourly: 8760   # 24 × 365
      weekly: 52

# -----------------------------------------------------------------------------
# App UI Settings
# -----------------------------------------------------------------------------
app_config:
  page_title: "Solar Forecasting & Savings"
  layout: "wide"
  initial_sidebar_state: "expanded"
  main_title: "🌞 Solar Panel Forecast & Savings Estimator"

app_settings:
  default_num_panels: 10000
  default_panel_capacity_kw: 0.750    # 750 W panel
  default_panel_efficiency: 0.85      # combined system efficiency (panel + inverter + wiring)
  default_export_tariff: 0.05         # $/kWh paid for energy exported to the grid

# -----------------------------------------------------------------------------
# Caching
# -----------------------------------------------------------------------------
caching:
  model_ttl_seconds: 3600  # how long Streamlit caches loaded models (seconds)

# -----------------------------------------------------------------------------
# Plotting
# -----------------------------------------------------------------------------
plotting_config:
  figure_size_mpl: [14, 11]
  tight_layout_pad_mpl: 4.5
  date_format_mpl: "%Y-%m-%d %Hh"
  date_format_weekly_mpl: "%Y-%m-%d"
  legend_fontsize_mpl: 10
  grid_visible_mpl: true
  grid_style_mpl: ":"
  # Figure sizes for additional plot types
  figure_size_residuals_mpl: [10, 8]
  figure_size_history_mpl: [10, 6]
  # Plot titles and axis labels (overridable without touching code)
  title_gen_mpl: "Solar Energy Generation Forecast (kW)"
  ylabel_gen_mpl: "Power (kW)"
  title_cost_mpl: "Electricity Cost Forecast ($/kWh)"
  ylabel_cost_mpl: "Cost ($/kWh)"
  title_cons_mpl: "Electricity Consumption Forecast (kWh)"
  ylabel_cons_mpl: "Energy (kWh)"
  xlabel_mpl: "Date"
